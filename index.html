<script>
    var sbClient;
    var currentMode = 'public';
    var SB_URL = "https://ycurewcdwnsbncafqbaj.supabase.co";
    var SB_KEY = "sb_publishable_5S2rpoBoCn1wWVAwDoGJnw_ilwXnPQg";

    // 1. 初始化连接（带自动重试）
    function initSupabase() {
        if (typeof Supabase !== 'undefined') {
            sbClient = Supabase.createClient(SB_URL, SB_KEY);
            console.log("Supabase 已连接");
            fetchPosts();
        } else {
            console.log("正在尝试通过备用链路加载...");
            setTimeout(initSupabase, 500);
        }
    }

    // 2. 模式切换
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('tab-public').className = (mode === 'public' ? 'tab active' : 'tab');
        document.getElementById('tab-private').className = (mode === 'private' ? 'tab active' : 'tab');
        document.getElementById('privateOptions').style.display = (mode === 'private' ? 'block' : 'none');
    }

    // 3. 获取数据
    async function fetchPosts() {
        if (!sbClient) return;
        try {
            const { data } = await sbClient.from('capsules').select('*').eq('is_public', true).order('created_at', { ascending: false });
            const list = document.getElementById('postsList');
            if (data && data.length > 0) {
                list.innerHTML = data.map(p => `<div class="post-item"><b style="color:#00f3ff">@${p.sender}</b><p>${p.content}</p></div>`).join('');
            } else {
                list.innerHTML = "广场空空如也，等待第一份投递...";
            }
        } catch (e) {
            document.getElementById('postsList').innerHTML = "数据链路同步中...";
        }
    }

    // 4. 处理发布动作
    function handleAction() {
        if (!document.getElementById('content').value) return alert("内容不能为空");
        if (!sbClient) return alert("连接尚未就绪，请稍等几秒...");
        
        if (currentMode === 'private') {
            document.getElementById('modal').style.display = 'flex';
        } else {
            finalSubmit();
        }
    }

    // 5. 最终提交
    async function finalSubmit() {
        const { error } = await sbClient.from('capsules').insert([{
            sender: document.getElementById('sender').value || "匿名",
            content: document.getElementById('content').value,
            category: document.getElementById('category').value,
            is_public: (currentMode === 'public'),
            release_time: document.getElementById('releaseDate').value || null
        }]);
        
        if (!error) {
            alert("投递成功！");
            location.reload();
        } else {
            alert("发送失败: " + error.message);
        }
    }

    window.onload = initSupabase;
</script>
