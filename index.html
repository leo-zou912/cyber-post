<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博邮报 | 时空投递站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --blue: #00f3ff; --bg: #0d0d0f; }
        body { background: var(--bg); color: #e0e0e0; font-family: sans-serif; padding: 15px; margin: 0; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--blue); color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:active { opacity: 0.7; }
        .post { border-bottom: 1px solid #222; padding: 15px 0; }
        .post-meta { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-bottom: 5px; }
        #modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Public Square</h3>
        <div id="list">Synchronizing...</div>
    </div>

    <div class="card">
        <h3>New Post</h3>
        <select id="u_mode" onchange="document.getElementById('p_opt').style.display=(this.value=='1'?'block':'none')">
            <option value="0">Public Post (Free)</option>
            <option value="1">Private Capsule (￥1.88)</option>
        </select>
        <input id="u_name" placeholder="Your Name">
        <input id="u_geo" placeholder="Locating...">
        <textarea id="u_content" rows="4" placeholder="What's on your mind?"></textarea>
        <div id="p_opt" style="display:none"><p>Unlock Date:</p><input type="date" id="u_date"></div>
        <button id="sendBtn" class="btn" onclick="send()">Post Now</button>
    </div>

    <div id="modal">
        <div style="padding:20px;">
            <p>Pay ￥1.88 to Seal</p>
            <img src="wx_pay.jpg" style="width:220px; border-radius:10px; margin:20px 0;">
            <button class="btn" onclick="commit()">I have paid</button>
            <p style="margin-top:20px; color:#888;" onclick="document.getElementById('modal').style.display='none'">Back</p>
        </div>
    </div>

    <script>
        var api;
        const SB_U = "https://ycurewcdwnsbncafqbaj.supabase.co", SB_K = "sb_publishable_5S2rpoBoCn1wWVAwDoGJnw_ilwXnPQg";

        // 英文定位逻辑：直接将结果填入输入框
        function getGeoInfo() {
            fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
                const location = (data.country_name || "") + " " + (data.city || "");
                document.getElementById('u_geo').value = location.trim() || "Earth";
            }).catch(() => {
                document.getElementById('u_geo').value = "Deep Space";
            });
        }

        function init() {
            getGeoInfo();
            if (window.supabase) {
                api = window.supabase.createClient(SB_U, SB_K);
                load();
            } else { setTimeout(init, 800); }
        }

        async function load() {
            if (!api) return;
            try {
                const { data, error } = await api.from('capsules').select('*').eq('is_public', true).order('created_at', { ascending: false });
                if (error) throw error;
                document.getElementById('list').innerHTML = data && data.length ? data.map(p => {
                    // 时间依然自动转为北京时间方便你查看，或者随系统时区
                    const localTime = new Date(p.created_at).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false});
                    return `<div class="post">
                        <div class="post-meta">
                            <b style="color:var(--blue)">@${p.sender}</b>
                            <span>${p.category || 'Remote'} · ${localTime}</span>
                        </div>
                        <p style="margin:0">${p.content}</p>
                    </div>`;
                }).join('') : "The square is empty...";
            } catch (e) { document.getElementById('list').innerHTML = "Sync Failed"; }
        }

        function send() {
            if (!document.getElementById('u_content').value) return alert("Content is empty");
            if (!api) return alert("Connecting...");
            
            // 检查：如果定位还没出来，提醒用户
            if (!document.getElementById('u_geo').value) {
                alert("Wait a second for GPS locking...");
                return;
            }

            if (document.getElementById('u_mode').value == '1') document.getElementById('modal').style.display = 'flex';
            else commit();
        }

        async function commit() {
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerText = "Sending...";

            const { error } = await api.from('capsules').insert([{
                sender: document.getElementById('u_name').value || "Anonymous",
                content: document.getElementById('u_content').value,
                is_public: document.getElementById('u_mode').value == '0',
                // 重要：发布时直接读取输入框里的地名
                category: document.getElementById('u_geo').value,
                release_time: document.getElementById('u_date').value || null
            }]);

            if (!error) { 
                alert("Post successful!"); 
                location.reload(); 
            } else { 
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerText = "Post Now";
            }
        }
        window.onload = init;
    </script>
</body>
</html>
