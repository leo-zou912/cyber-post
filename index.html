<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博邮报</title>
    <script src="https://npm.elemecdn.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --blue: #00f3ff; --bg: #0d0d0f; }
        body { background: var(--bg); color: #e0e0e0; font-family: sans-serif; padding: 15px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--blue); color: #000; font-weight: bold; }
        .post { border-bottom: 1px solid #222; padding: 10px 0; }
        #modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="card">
        <h3>公共广场</h3>
        <div id="list">正在同步链路...</div>
    </div>
    <div class="card">
        <h3>新投递</h3>
        <select id="mode" onchange="document.getElementById('p_opt').style.display=(this.value=='1'?'block':'none')">
            <option value="0">免费公开</option>
            <option value="1">私密封存 (￥1.88)</option>
        </select>
        <input id="u" placeholder="你的称呼">
        <textarea id="c" rows="4" placeholder="写下内容..."></textarea>
        <div id="p_opt" style="display:none"><input type="date" id="d"></div>
        <button class="btn" onclick="send()">立即发布</button>
    </div>
    <div id="modal">
        <p>支付 1.88 元开启封存</p>
        <img src="wx_pay.jpg" style="width:200px; margin:20px">
        <button onclick="commit()">我已支付</button>
        <p onclick="this.parentElement.style.display='none'">返回</p>
    </div>
    <script>
        var api, SB_U = "https://ycurewcdwnsbncafqbaj.supabase.co", SB_K = "sb_publishable_5S2rpoBoCn1wWVAwDoGJnw_ilwXnPQg";
        function init() {
            if (window.Supabase) {
                api = Supabase.createClient(SB_U, SB_K);
                load();
            } else { setTimeout(init, 500); }
        }
        async function load() {
            const { data } = await api.from('capsules').select('*').eq('is_public', true).order('created_at', { ascending: false });
            document.getElementById('list').innerHTML = data && data.length ? data.map(p => `<div class="post"><b>@${p.sender}</b><p>${p.content}</p></div>`).join('') : "广场空空如也...";
        }
        function send() {
            if (!document.getElementById('c').value) return alert("空内容");
            if (!api) return alert("连接中...");
            if (document.getElementById('mode').value == '1') document.getElementById('modal').style.display = 'flex';
            else commit();
        }
        async function commit() {
            const { error } = await api.from('capsules').insert([{
                sender: document.getElementById('u').value || "匿名",
                content: document.getElementById('c').value,
                is_public: document.getElementById('mode').value == '0',
                release_time: document.getElementById('d').value || null
            }]);
            if (!error) { alert("成功"); location.reload(); } else { alert("失败"); }
        }
        window.onload = init;
    </script>
</body>
</html>
