<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博邮报 | 数字化生存档案</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-blue: #00f3ff; --dark-bg: #0d0d0f; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--dark-bg); color: #e0e0e0; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; overflow-x: hidden; }
        .card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        h2 { color: var(--neon-blue); font-size: 1.1rem; margin-top: 0; border-left: 3px solid var(--neon-blue); padding-left: 10px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; outline: none; }
        .tab-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-size: 0.85rem; background: rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .tab.active { background: var(--neon-blue); color: #000; font-weight: bold; }
        .search-bar { position: sticky; top: 0; z-index: 100; background: var(--dark-bg); padding: 10px 0; }
        .post-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 0; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tag { font-size: 0.65rem; background: rgba(0, 243, 255, 0.1); color: var(--neon-blue); padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        .price-notice { text-align: center; font-size: 1.2rem; color: var(--neon-blue); margin: 15px 0; font-family: monospace; text-shadow: 0 0 8px var(--neon-blue); }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; background: linear-gradient(90deg, #00f3ff, #0077ff); cursor: pointer; transition: 0.3s; }
        .btn-main:active { transform: scale(0.98); opacity: 0.8; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; flex-direction: column; padding: 20px; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 搜索公开的音乐、故事、秘密..." oninput="searchPosts()">
    </div>

    <div class="card" id="square">
        <h2>公共广场</h2>
        <div id="postsList">正在接入数据链路...</div>
    </div>

    <div class="card">
        <h2>新投递任务</h2>
        <div class="tab-group">
            <div class="tab active" id="tab-public" onclick="setMode('public')">免费公开</div>
            <div class="tab" id="tab-private" onclick="setMode('private')">私密封存</div>
        </div>
        
        <input type="text" id="sender" placeholder="你的称呼 (或 IP 匿名)">
        <select id="category">
            <option value="story">📖 故事/文字</option>
            <option value="music">🎵 音乐/链接</option>
            <option value="secret">🤫 秘密/心情</option>
        </select>
        <textarea id="content" rows="4" placeholder="在这里写下你的内容..."></textarea>
        
        <div id="privateOptions" style="display:none;">
            <label style="font-size: 0.75rem; color: #aaa;">设定解封日期 (可选)：</label>
            <input type="date" id="releaseDate">
            <div class="price-notice" id="dynamicPrice">￥ 1.88</div>
        </div>

        <button class="btn-main" id="submitBtn" onclick="handleAction()">立即发布</button>
    </div>

    <div id="modal">
        <div style="text-align:center; background: #1a1a1c; padding: 30px; border-radius: 20px; border: 1px solid var(--neon-blue);">
            <p style="margin-bottom: 20px;">建立个人加密通道</p>
            <img id="qrImg" style="width:200px; height:200px; background:#fff; border-radius:10px; padding:10px; margin-bottom: 20px;">
            <button class="btn-main" onclick="finalSubmit()">我已支付，确认封存</button>
            <p style="font-size: 0.8rem; color: #555; margin-top: 15px;" onclick="document.getElementById('modal').style.display='none'">取消</p>
        </div>
    </div>

    <script>
        // --- 配置区域 ---
        const SB_URL = "https://ycurewcdwnsbncafqbaj.supabase.co";
        const SB_KEY = "你的_ANON_KEY_填在这里"; // 粘贴你那串 sb_publishable 开头的密钥
        const supabase = supabase.createClient(SB_URL, SB_KEY);

        let currentMode = 'public';
        let randomPrice = (Math.random() * (2.0 - 1.0) + 1.0).toFixed(2);

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-public').classList.toggle('active', mode === 'public');
            document.getElementById('tab-private').classList.toggle('active', mode === 'private');
            document.getElementById('privateOptions').style.display = mode === 'private' ? 'block' : 'none';
            document.getElementById('submitBtn').innerText = mode === 'private' ? '建立加密连接' : '立即发布';
            if(mode === 'private') document.getElementById('dynamicPrice').innerText = "￥ " + randomPrice;
        }

        async function searchPosts() {
            const keyword = document.getElementById('searchInput').value;
            let query = supabase.from('capsules').select('*').eq('is_public', true);
            if(keyword) query = query.ilike('content', `%${keyword}%`);
            
            const { data, error } = await query.order('created_at', { ascending: false }).limit(10);
            const list = document.getElementById('postsList');
            if(data && data.length > 0) {
                list.innerHTML = data.map(p => `
                    <div class="post-item">
                        <span class="tag">${p.category === 'music' ? '🎵' : (p.category === 'story' ? '📖' : '🤫')}</span>
                        <b style="color:var(--neon-blue)">@${p.sender}</b>
                        <p style="font-size:0.9rem; margin:8px 0; color:#bbb;">${p.content}</p>
                    </div>
                `).join('');
            } else {
                list.innerHTML = "<p style='font-size:0.8rem; color:#666;'>广场空空如也，等待第一份投递...</p>";
            }
        }

        function handleAction() {
            if(!document.getElementById('content').value) return alert("内容不能为空");
            if(currentMode === 'private') {
                document.getElementById('modal').style.display = 'flex';
                document.getElementById('qrImg').src = 'wx_pay.jpg'; // 确保你仓库里有这张图
            } else {
                finalSubmit();
            }
        }

        async function finalSubmit() {
            const sender = document.getElementById('sender').value || "匿名信使";
            const content = document.getElementById('content').value;
            const category = document.getElementById('category').value;
            const accessKey = "CP-" + Math.floor(1000 + Math.random()*9000);

            const { error } = await supabase.from('capsules').insert([{
                sender, content, category, 
                is_public: (currentMode === 'public'),
                access_key: accessKey,
                release_time: document.getElementById('releaseDate').value || null
            }]);

            if(!error) {
                alert(`[投递成功]\n${currentMode==='private' ? '唯一凭证码: '+accessKey : '已在广场发布'}`);
                location.reload();
            } else {
                alert("投递失败，请检查网络或配置: " + error.message);
            }
        }

        searchPosts();
 </script>

 <script>
    // --- 数据库连接配置 ---
    const SB_URL = "https://ycurewcdwnsbncafqbaj.supabase.co";
    const SB_KEY = "sb_publishable_5S2rpoBoCn1wWVAwDoGJnw_ilwXnPQg"; 
    const supabase = supabase.createClient(SB_URL, SB_KEY);
</script>
                                  
</body>
</html>
