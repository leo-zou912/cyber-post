<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博邮报 | 时空投递站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --blue: #00f3ff; --bg: #0d0d0f; }
        body { background: var(--bg); color: #e0e0e0; font-family: sans-serif; padding: 15px; margin: 0; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--blue); color: #000; font-weight: bold; cursor: pointer; }
        .post { border-bottom: 1px solid #222; padding: 15px 0; }
        .post-meta { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 5px; }
        #modal { display: none; position: fixed; inset: 0; background: #000; z-index: 99; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h3>公共广场</h3>
        <div id="list">正在接入数据链路...</div>
    </div>

    <div class="card">
        <h3>新投递</h3>
        <select id="mode" onchange="document.getElementById('p_opt').style.display=(this.value=='1'?'block':'none')">
            <option value="0">免费公开投递</option>
            <option value="1">私密封存 (￥1.88)</option>
        </select>
        <input id="u" placeholder="你的称呼">
        <textarea id="c" rows="4" placeholder="此刻你在想什么？"></textarea>
        <div id="p_opt" style="display:none"><p>设置解锁日期：</p><input type="date" id="d"></div>
        <button class="btn" onclick="send()">立即发布</button>
    </div>

    <div id="modal">
        <div style="padding:20px;">
            <p>支付 1.88 元开启封存</p>
            <img src="wx_pay.jpg" style="width:220px; border-radius:10px; margin:20px 0;">
            <button class="btn" onclick="commit()">我已支付</button>
            <p style="margin-top:20px; color:#888;" onclick="document.getElementById('modal').style.display='none'">返回修改</p>
        </div>
    </div>

    <script>
        var api, userCity = "未知时空";
        const SB_U = "https://ycurewcdwnsbncafqbaj.supabase.co", SB_K = "sb_publishable_5S2rpoBoCn1wWVAwDoGJnw_ilwXnPQg";

        // 自动获取地标
        fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
            userCity = data.city ? `${data.country_name} ${data.city}` : "未知时空";
        }).catch(() => userCity = "星际边缘");

        function init() {
            if (window.supabase) {
                api = window.supabase.createClient(SB_U, SB_K);
                load();
            } else { setTimeout(init, 800); }
        }

        async function load() {
            if (!api) return;
            try {
                const { data, error } = await api.from('capsules').select('*').eq('is_public', true).order('created_at', { ascending: false });
                if (error) throw error;
                document.getElementById('list').innerHTML = data && data.length ? data.map(p => {
                    const localTime = new Date(p.created_at).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false});
                    return `<div class="post">
                        <div class="post-meta">
                            <b style="color:var(--blue)">@${p.sender}</b>
                            <span>${p.category || '未知'} · ${localTime}</span>
                        </div>
                        <p style="margin:0">${p.content}</p>
                    </div>`;
                }).join('') : "广场空空如也...";
            } catch (e) { document.getElementById('list').innerHTML = "链路同步失败"; }
        }

        function send() {
            if (!document.getElementById('c').value) return alert("内容不能为空");
            if (!api) return alert("连接中...");
            if (document.getElementById('mode').value == '1') document.getElementById('modal').style.display = 'flex';
            else commit();
        }

        async function commit() {
            const { error } = await api.from('capsules').insert([{
                sender: document.getElementById('u').value || "匿名",
                content: document.getElementById('c').value,
                is_public: document.getElementById('mode').value == '0',
                category: userCity, // 将地标存入 category 字段
                release_time: document.getElementById('d').value || null
            }]);
            if (!error) { alert("投递成功！"); location.reload(); }
            else { alert("失败：" + error.message); }
        }

        window.onload = init;
    </script>
</body>
</html>
