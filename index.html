<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博邮报 | 数字化生存档案</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-blue: #00f3ff; --dark-bg: #0d0d0f; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--dark-bg); color: #e0e0e0; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        h2 { color: var(--neon-blue); font-size: 1.1rem; margin-top: 0; border-left: 3px solid var(--neon-blue); padding-left: 10px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; box-sizing: border-box; }
        .tab-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; background: rgba(255,255,255,0.05); cursor: pointer; }
        .tab.active { background: var(--neon-blue); color: #000; font-weight: bold; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; background: linear-gradient(90deg, #00f3ff, #0077ff); color: white; }
        .post-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 0; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
    </style>
</head>
<body>

    <div class="card" id="square">
        <h2>公共广场</h2>
        <div id="postsList">正在接入数据链路...</div>
    </div>

    <div class="card">
        <h2>新投递任务</h2>
        <div class="tab-group">
            <div class="tab active" id="tab-public" onclick="setMode('public')">免费公开</div>
            <div class="tab" id="tab-private" onclick="setMode('private')">私密封存</div>
        </div>
        <input type="text" id="sender" placeholder="你的称呼">
        <select id="category">
            <option value="story">📖 故事/文字</option>
            <option value="music">🎵 音乐/链接</option>
            <option value="secret">🤫 秘密/心情</option>
        </select>
        <textarea id="content" rows="4" placeholder="写下你想说的话..."></textarea>
        <div id="privateOptions" style="display:none;">
            <input type="date" id="releaseDate">
            <p style="text-align:center; color:var(--neon-blue);">￥ 1.88</p>
        </div>
        <button class="btn-main" onclick="handleAction()">立即发布</button>
    </div>

    <div id="modal">
        <div style="text-align:center; background: #1a1a1c; padding: 30px; border-radius: 20px; border: 1px solid var(--neon-blue);">
            <p>扫码完成支付以封存</p>
            <img src="wx_pay.jpg" style="width:200px; margin: 20px 0;">
            <button class="btn-main" onclick="finalSubmit()">我已支付</button>
            <p style="margin-top:10px;" onclick="document.getElementById('modal').style.display='none'">取消</p>
        </div>
    </div>

    <script>
        // --- 核心配置 (请确保 Supabase 首字母大写) ---
        const SB_URL = "https://ycurewcdwnsbncafqbaj.supabase.co";
        const SB_KEY = "sb_publishable_5S2rpoBoCn1wWVAwDoGJnw_ilwXnPQg";
        const supabase = Supabase.createClient(SB_URL, SB_KEY);

        let currentMode = 'public';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-public').classList.toggle('active', mode === 'public');
            document.getElementById('tab-private').classList.toggle('active', mode === 'private');
            document.getElementById('privateOptions').style.display = mode === 'private' ? 'block' : 'none';
        }

        async function searchPosts() {
            const { data, error } = await supabase.from('capsules').select('*').eq('is_public', true).order('created_at', { ascending: false });
            const list = document.getElementById('postsList');
            if (data && data.length > 0) {
                list.innerHTML = data.map(p => `
                    <div class="post-item">
                        <b style="color:var(--neon-blue)">@${p.sender}</b>
                        <p>${p.content}</p>
                    </div>
                `).join('');
            } else {
                list.innerHTML = "广场空空如也，等待第一份投递...";
            }
        }

        function handleAction() {
            if (!document.getElementById('content').value) return alert("写点什么吧");
            if (currentMode === 'private') {
                document.getElementById('modal').style.display = 'flex';
            } else {
                finalSubmit();
            }
        }

        async function finalSubmit() {
            const { error } = await supabase.from('capsules').insert([{
                sender: document.getElementById('sender').value || "匿名",
                content: document.getElementById('content').value,
                category: document.getElementById('category').value,
                is_public: (currentMode === 'public'),
                release_time: document.getElementById('releaseDate').value || null
            }]);
            if (!error) {
                alert("投递成功！");
                location.reload();
            } else {
                alert("发布失败，请检查网络");
            }
        }

        searchPosts();
    </script>
</body>
</html>
