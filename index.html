<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成都洗衣店 | 赛博信使投递站</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #0a0a0c;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* 模拟洗衣店蒸汽的背景动画 */
        .steam {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 70%);
            z-index: -1;
            filter: blur(50px);
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 0.8rem;
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #bbb;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--neon-blue);
        }

        .price-tag {
            text-align: center;
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin: 20px 0;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00f3ff, #0077ff);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="steam"></div>
    <div class="container">
        <h1>时光投递站</h1>
        <p class="subtitle">成都洗衣店 · 编号001号实验</p>
        
        <form id="postForm">
            <div class="input-group">
                <label>你的称呼 (或编号)</label>
                <input type="text" placeholder="怎么称呼你？" required>
            </div>

            <div class="input-group">
                <label>你想存下的内容 (文字/秘密)</label>
                <textarea rows="4" placeholder="写下你想对TA、或者对未来自己说的话..."></textarea>
            </div>

            <div class="input-group">
                <label>背景音乐风格</label>
                <select>
                    <option>2010s 怀旧流行</option>
                    <option>洗衣店白噪音 (蒸汽感)</option>
                    <option>Lo-Fi 赛博氛围</option>
                    <option>静谧钢琴</option>
                </select>
            </div>

            <div class="input-group">
                <label>开启时间</label>
                <input type="date">
            </div>

            <div class="price-tag">￥ 1.00</div>
            
            <button type="button" onclick="handleSubmit()">立即投递</button>
        </form>

        <div class="footer">
            “洗去衣上的尘埃，留住心里的声音。”<br>
            © 2026 赛博信使计划
        </div>
    </div>

    <script>
        function handleSubmit() {
            alert('投递功能已触发！\n这只是一个原型界面，下一步我们需要接入后端数据库。');
        }
    </script>
</body>
</html>
